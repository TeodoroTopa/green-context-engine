rules:
- Do not frame 1–2 year changes in climate-related metrics (e.g., heating or cooling
  degree days) as trends; short-term shifts reflect weather variability, and climate
  trends require longer time horizons to establish.
- Distinguish between electricity demand and total energy demand — heating is often
  gas-powered while cooling is electric — so seasonal demand peaks differ by energy
  type, and solar generation offsets only the electricity share.
- When citing a quantitative metric (e.g., solar radiation, resource potential), always
  include a comparative benchmark (e.g., vs. national/regional average or other locations)
  so readers can judge whether the figure is high or low.
- Avoid stating obvious, elementary facts (e.g., 'solar only works in daylight,' 'Texas
  is sunny') at face value; instead frame them in a more sophisticated, analytical
  way that adds insight, such as explaining their strategic or competitive implications.
